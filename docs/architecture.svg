<text x="600.0" y="1070" fill="#eee5f9" font-size="19" font-weight="700">Read-only overlay</text>
<text x="600.0" y="1095" fill="#c4b6d7" font-size="16">Revocable read access</text>
<rect x="820" y="1040" width="340" height="72" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="990.0" y="1070" fill="#eee5f9" font-size="19" font-weight="700">Attributed recap</text>
