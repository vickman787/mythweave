<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">Mythweave architecture</title>
<desc id="desc">Twitch chat, authenticated companion and labeled demo input pass through identity checks, bounded interpretation, validation, community support and streamer approval. The server revalidates and commits atomically to SQLite, then publishes public state to the control room, overlay and recap. Optional AI only maps ideas to allowed action IDs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bfa3ef"/></marker></defs>
<rect width="1200" height="1150" rx="20" fill="#0b0b17"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<text x="600" y="45" fill="#e8cc8a" font-size="30" font-weight="700">From chat to a changed world</text>
<text x="600" y="78" fill="#c4b6d7" font-size="18">Every accepted action is checked, approved and persisted.</text>

