<text x="210.0" y="140" fill="#eee5f9" font-size="19" font-weight="700">Twitch chat</text>
<text x="210.0" y="165" fill="#c4b6d7" font-size="16">OAuth identity · EventSub WebSocket</text>
<rect x="430" y="110" width="340" height="85" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="600.0" y="140" fill="#eee5f9" font-size="19" font-weight="700">Authenticated companion</text>
<text x="600.0" y="165" fill="#c4b6d7" font-size="16">Twitch identity · participation API</text>
<rect x="820" y="110" width="340" height="85" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="990.0" y="140" fill="#eee5f9" font-size="19" font-weight="700">Labeled demo simulator</text>
<text x="990.0" y="165" fill="#c4b6d7" font-size="16">Seeded fictional participants</text>
<rect x="430" y="245" width="340" height="80" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="600.0" y="275" fill="#eee5f9" font-size="19" font-weight="700">1. Authenticate and deduplicate</text>
<text x="600.0" y="300" fill="#c4b6d7" font-size="16">Express API · viewer/event checks</text>
<rect x="430" y="365" width="340" height="80" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="600.0" y="395" fill="#eee5f9" font-size="19" font-weight="700">2. Interpret a supported action</text>
<text x="600.0" y="420" fill="#c4b6d7" font-size="16">Deterministic authored catalogue</text>
<rect x="830" y="365" width="330" height="110" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="995.0" y="395" fill="#eee5f9" font-size="19" font-weight="700">Optional OpenAI classifier</text>
<text x="995.0" y="420" fill="#c4b6d7" font-size="16">Unsupported phrases · opt-in only</text>
<text x="995.0" y="443" fill="#c4b6d7" font-size="16">Returns an allowed action ID</text>
<rect x="430" y="485" width="340" height="80" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="600.0" y="515" fill="#eee5f9" font-size="19" font-weight="700">3. Validate the proposal</text>
<text x="600.0" y="540" fill="#c4b6d7" font-size="16">Role · encounter · Aether · conditions</text>
<rect x="430" y="605" width="340" height="80" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="600.0" y="635" fill="#eee5f9" font-size="19" font-weight="700">4. Group ideas and collect support</text>
<text x="600.0" y="660" fill="#c4b6d7" font-size="16">One support per identity · threshold</text>
<rect x="430" y="725" width="340" height="80" rx="13" fill="#29203d" stroke="#d6b4ff" stroke-width="1.5"/>
<text x="600.0" y="755" fill="#f0dbad" font-size="19" font-weight="700">5. Streamer approval</text>
<text x="600.0" y="780" fill="#c4b6d7" font-size="16">Explicit review · approve or reject</text>
<rect x="430" y="845" width="340" height="104" rx="13" fill="#29203d" stroke="#d6b4ff" stroke-width="1.5"/>
<text x="600.0" y="875" fill="#f0dbad" font-size="19" font-weight="700">6. Revalidate and commit</text>
<text x="600.0" y="900" fill="#c4b6d7" font-size="16">Owner · version · readiness · support</text>
<text x="600.0" y="923" fill="#c4b6d7" font-size="16">Atomic transaction · accepted event</text>
<rect x="40" y="845" width="335" height="104" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="207.5" y="875" fill="#eee5f9" font-size="19" font-weight="700">SQLite persistence</text>
<text x="207.5" y="900" fill="#c4b6d7" font-size="16">Checkpoints · accepted decisions</text>
<text x="207.5" y="923" fill="#c4b6d7" font-size="16">AES-256-GCM Twitch tokens</text>
<rect x="830" y="845" width="330" height="104" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="995.0" y="875" fill="#eee5f9" font-size="19" font-weight="700">Server-sent events</text>
<text x="995.0" y="900" fill="#c4b6d7" font-size="16">Authoritative public state</text>
<text x="995.0" y="923" fill="#c4b6d7" font-size="16">No streamer control rights</text>
<rect x="40" y="1040" width="340" height="72" rx="13" fill="#171323" stroke="#635077" stroke-width="1.5"/>
<text x="210.0" y="1070" fill="#eee5f9" font-size="19" font-weight="700">Control room</text>
<text x="210.0" y="1095" fill="#c4b6d7" font-size="16">Current world and proposals</text>
